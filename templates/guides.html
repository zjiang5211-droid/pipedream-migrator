<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migration Guides — Pipedream to n8n</title>
<meta name="description" content="Guides for migrating off Pipedream Workflows before the March 31, 2027 shutdown and April 30, 2027 data deletion.">
<style>
:root{--bg:#0f1115;--ink:#e8eaf0;--muted:#9aa0b4;--accent:#7c6cf0;--card:#171a21;--line:#262b38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header.top{padding:22px 0 4px}.logo a{color:var(--ink);text-decoration:none;font-weight:800;font-size:20px}.logo span{color:var(--accent)}
h1{font-size:30px;letter-spacing:-.5px}
.guide-list a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;color:var(--ink);margin:12px 0}
.guide-list a:hover{border-color:var(--accent)}
.guide-list .t{font-weight:700;font-size:18px}.guide-list .d{font-size:14px;color:var(--muted);margin-top:4px}
footer{border-top:1px solid var(--line);margin-top:30px;padding:22px 0 40px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="logo"><a href="/">pipedream<span>→</span>n8n</a></div></header>
<h1>Migration guides</h1>
<div class="guide-list">
{% for g in guides %}
<a href="/guides/{{ g.slug }}"><div class="t">{{ g.title }}</div><div class="d">{{ g.description }}</div></a>
{% endfor %}
</div>
<footer>Not affiliated with Pipedream or n8n. Dates from <a href="https://pipedream.com/docs/workflows" style="color:var(--muted)">pipedream.com/docs</a>.</footer>
</div>
</body>
</html>
